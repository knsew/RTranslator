# Build a debug APK on every push to the main branch (public repository:
# standard GitHub-hosted runners are free). The APK is uploaded as a build
# artifact for testing; no Release is created here.
name: Android CI

on:
  push:
    branches: [v3.00]
  pull_request:
    branches: [v3.00]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # the project needs NDK 28.0.12674087, which is not preinstalled on the
      # runner; without accepted licenses AGP refuses to install it
      - name: Install NDK and accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.12674087"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
